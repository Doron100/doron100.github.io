<style>
/* Heavenly bio page: drifting sunlit clouds (WebGL) + soft light motes at the cursor, intro, click-to-enter, frosted ivory card with a floating halo. Light by design. */
:root{
  --bg:#eef3fa; --fg:#2a2733; --muted:rgba(42,39,51,.58); --line:rgba(160,130,60,.22);
  --gold:#b8913f; --gold2:#e6cf94; --card:rgba(255,253,248,.55);
  --font-b:'Onest',system-ui,sans-serif; --font-s:'Cormorant Garamond',Georgia,serif; --font-m:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light; --intro:2.1s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#eef3fa}}
:root[data-theme="dark"]{--bg:#eef3fa}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-b);overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
::selection{background:var(--gold2);color:var(--fg)}

#smoke{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;background:radial-gradient(ellipse at 50% -10%,#fff8e6,transparent 60%),linear-gradient(180deg,#bcd3ee,#f6efe4)}
.vig{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(255,244,214,.55),transparent 55%)}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* intro */
#intro{position:fixed;inset:0;z-index:100;cursor:pointer;animation:gone 0s calc(var(--intro) + .9s) forwards;color:var(--ifg);font-family:var(--font-b)}
@keyframes gone{to{visibility:hidden;pointer-events:none}}
#intro .half{position:absolute;left:0;right:0;height:50.2%;background:var(--ibg);animation-duration:.9s;animation-timing-function:cubic-bezier(.77,0,.18,1);animation-fill-mode:forwards;animation-delay:calc(var(--intro) - .4s)}
#intro .top{top:0;animation-name:up}
#intro .bot{bottom:0;animation-name:down}
@keyframes up{to{transform:translateY(-101%)}}
@keyframes down{to{transform:translateY(101%)}}
#intro .mid{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding:16px;animation:midout .5s calc(var(--intro) - .7s) forwards}
@keyframes midout{to{opacity:0;transform:scale(1.04)}}
#intro .name{display:flex;font-family:var(--font-s);font-style:italic;font-size:clamp(28px,6vw,52px);font-weight:600;white-space:nowrap}
#intro .name b{font-weight:inherit;display:inline-block;animation:iin .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*45ms + .1s)}
@keyframes iin{from{opacity:0;transform:translateY(60%) scale(.9);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
#intro .bar{width:min(320px,70vw);height:1px;background:rgba(184,145,63,.25);position:relative;overflow:hidden}
#intro .bar::after{content:"";position:absolute;inset:0;background:var(--gold);transform-origin:left;animation:fill calc(var(--intro) - .7s) cubic-bezier(.6,.1,.2,1) forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#intro .pc{font-family:var(--font-m);font-size:12px;letter-spacing:.2em;opacity:.6}
#intro{--ibg:#fbf7ef;--ifg:#2a2733}

/* enter */
#enter{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(250,247,240,.45);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);cursor:pointer;transition:opacity .8s ease,visibility .8s}
#enter.gone{opacity:0;visibility:hidden}
#enter span{font-family:var(--font-m);font-size:15px;letter-spacing:.3em;text-transform:lowercase;color:var(--fg);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* layout */
main{position:relative;z-index:2;min-height:100%;display:flex;align-items:center;justify-content:center;padding:64px 0 48px}
.wrap{width:100%;max-width:460px;perspective:1000px}
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.35) 45%),var(--card);border:1px solid rgba(255,255,255,.8);border-radius:20px;padding:48px 30px 26px;
  backdrop-filter:blur(16px) saturate(1.15);-webkit-backdrop-filter:blur(16px) saturate(1.15);
  box-shadow:0 30px 70px -25px rgba(70,80,120,.45),0 0 0 1px rgba(184,145,63,.08) inset;text-align:center;transform-style:preserve-3d;transition:transform .2s ease-out;
  opacity:0;transform:translateY(24px)}
body.in .card{animation:cardin .9s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes cardin{to{opacity:1;transform:none}}

@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
.card::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0deg,rgba(214,176,92,.9) 40deg,transparent 90deg,transparent 180deg,rgba(255,255,255,.95) 220deg,transparent 270deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 9s linear infinite}
@keyframes spin{to{--a:360deg}}
.cn{position:absolute;width:16px;height:16px;border:0 solid var(--gold);opacity:.7;pointer-events:none}
.cn.tl{top:-9px;left:-9px;border-top-width:1px;border-left-width:1px}
.cn.tr{top:-9px;right:-9px;border-top-width:1px;border-right-width:1px}
.cn.bl{bottom:-9px;left:-9px;border-bottom-width:1px;border-left-width:1px}
.cn.br{bottom:-9px;right:-9px;border-bottom-width:1px;border-right-width:1px}

.av{position:relative;width:108px;height:108px;margin:0 auto 20px}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;position:relative;filter:sepia(.15) saturate(.9)}
.av .ring{position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(184,145,63,.35);box-shadow:0 0 30px 6px rgba(255,236,190,.65)}
.av .ring::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid transparent;border-top-color:var(--gold);animation:rot 7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.halo{position:absolute;left:50%;top:-30px;width:78px;height:20px;margin-left:-39px;border-radius:50%;border:3px solid #f1d78d;
  box-shadow:0 0 14px 3px rgba(255,226,140,.9),0 0 3px rgba(184,145,63,.9) inset;animation:float 4s ease-in-out infinite;pointer-events:none}
@keyframes float{50%{transform:translateY(-5px)}}
.av i{position:absolute;right:2px;bottom:2px;width:20px;height:20px;border-radius:50%;background:#3ba55d;border:4px solid #fbf8f2}

h1{margin:0;font-family:var(--font-s);font-style:italic;font-size:46px;font-weight:600;letter-spacing:.01em;line-height:1.05;color:#2a2733;
  text-shadow:0 0 18px rgba(255,230,160,.9)}
.handle{font-family:var(--font-m);font-size:12px;letter-spacing:.08em;color:var(--muted);margin:8px 0 0}
.views{display:inline-flex;align-items:center;gap:6px;margin:10px 0 0;font-family:var(--font-m);font-size:11.5px;letter-spacing:.06em;color:var(--muted);
  padding:4px 11px;border-radius:30px;border:1px solid var(--line);background:rgba(255,255,255,.45)}
.views svg{width:14px;height:14px;fill:none;stroke:var(--gold);stroke-width:1.8}
.views[hidden]{display:none}
.type{font-size:14.5px;color:rgba(42,39,51,.85);margin:12px 0 0;min-height:1.5em}
.type b{display:inline-block;width:2px;height:1.05em;background:var(--gold);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.badges{display:flex;justify-content:center;flex-wrap:wrap;margin:16px 0 0;font-family:var(--font-m);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.badges span{display:inline-flex;align-items:center}
.badges span+span::before{content:"";width:3px;height:3px;border-radius:50%;background:var(--gold);margin:0 12px;opacity:.8}

.div{position:relative;height:1px;margin:22px 0 4px;background:linear-gradient(90deg,transparent,rgba(184,145,63,.45),transparent)}
.div i{position:absolute;left:50%;top:50%;width:7px;height:7px;border:1px solid var(--gold);background:#fbf8f1;transform:translate(-50%,-50%) rotate(45deg)}

.box{display:flex;align-items:center;gap:14px;text-align:left;margin-top:18px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 18px -10px rgba(70,80,120,.35);transition:background .3s,border-color .3s,transform .3s,box-shadow .3s}
a.box:hover{background:rgba(255,255,255,.8);border-color:var(--gold2);transform:translateY(-2px);box-shadow:0 10px 26px -10px rgba(184,145,63,.45)}
.box .ic{flex:none;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(180deg,#fffaf0,#f3e7cc);border:1px solid var(--line);color:var(--gold)}
.box .ic svg{width:20px;height:20px}
.box .tx{min-width:0;flex:1}
.box .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .tx small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .ar{flex:none;font-size:18px;opacity:.5;color:var(--gold);transition:transform .25s,opacity .25s}
a.box:hover .ar{transform:translateX(3px);opacity:1}
.lbl{font-family:var(--font-m);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:left;margin:22px 2px -10px}

.soc{display:flex;justify-content:center;gap:12px;margin-top:22px}
.soc a{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);box-shadow:0 4px 14px -8px rgba(70,80,120,.4);transition:transform .3s,border-color .3s,box-shadow .3s}
.soc a:hover{transform:translateY(-2px);border-color:var(--gold2);box-shadow:0 0 20px rgba(255,220,140,.7)}
.soc a.fp{width:auto;border-radius:40px;padding:0 16px}
.fp span{font-family:var(--font-b);font-weight:800;font-size:13px;letter-spacing:.04em;color:#1f1d26;display:inline-flex;align-items:center}
.fp b{display:inline-grid;place-items:center;width:13px;height:20px;margin:0 1px;font-size:11px;color:#fff;background:linear-gradient(180deg,#5aa2f2,#2f74d6);clip-path:polygon(50% 0,100% 20%,100% 80%,50% 100%,0 80%,0 20%)}
.soc svg{width:17px;height:17px;fill:currentColor}

.foot{margin-top:22px;font-family:var(--font-m);font-size:11px;color:var(--muted);display:flex;justify-content:center;gap:6px;align-items:center}
.foot i{width:6px;height:6px;border-radius:50%;background:#3ba55d}

@media (max-width:420px){.card{padding:44px 20px 22px}h1{font-size:40px}}
@media (prefers-reduced-motion:reduce){#intro{display:none}*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>

<script>
(function(){

  /* медленный дым на весь фон (WebGL): на телефонах легче, переживает потерю видеоконтекста */
  (function(){
    var c=document.getElementById('smoke');
    var weak=matchMedia('(pointer:coarse)').matches||innerWidth<700||(navigator.hardwareConcurrency||8)<=4;
    var OCT=weak?4:5, sc=weak?.33:.5, step=weak?2:1;
    var vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    var fs='precision mediump float;uniform vec2 r;uniform float t;uniform vec2 m;'+
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}'+
      'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}'+
      'float fb(vec2 p){float v=0.,a=.5;mat2 R=mat2(.8,.6,-.6,.8);for(int i=0;i<'+OCT+';i++){v+=a*n(p);p=R*p*2.02;a*=.5;}return v;}'+
      'void main(){vec2 uv=gl_FragCoord.xy/r.y;float T=t*.035;'+
      'vec2 mm=m/r.y;float md=exp(-6.*length(uv-mm));'+
      'vec2 q=vec2(fb(uv*1.6+vec2(0.,T)),fb(uv*1.6+vec2(5.2,1.3)-T));'+
      'vec2 w=vec2(fb(uv*1.6+3.*q+vec2(1.7,9.2)+T*.6),fb(uv*1.6+3.*q+vec2(8.3,2.8)-T*.4));'+
      'float d=fb(uv*1.6+3.2*w+md*.6);'+
      'vec2 sp=gl_FragCoord.xy/r;'+'vec3 sky=mix(vec3(.96,.92,.86),vec3(.64,.78,.93),smoothstep(0.,1.,sp.y));'+'float sun=exp(-3.*length((sp-vec2(.5,1.08))*vec2(r.x/r.y,1.)));'+'sky=mix(sky,vec3(1.,.95,.82),sun*.85);'+'float ray=pow(.5+.5*sin(atan(sp.x-.5,1.1-sp.y)*22.+T*3.),6.)*sun*.35;'+'float cl=smoothstep(.38,.85,d);'+'vec3 cloud=mix(vec3(.86,.88,.95),vec3(1.,.985,.95),smoothstep(.5,1.,d)+md*.3);'+'vec3 col=mix(sky,cloud,cl*.9)+ray*vec3(1.,.93,.75);'+'float ax=sp.x*1.8+uv.x*.5;'+'float l1=.065*pow(abs(sin(ax*2.6-T*.9)),.55)+.045*pow(abs(sin(ax*6.1+1.3-T*1.3)),.6)+.025*pow(abs(sin(ax*13.+2.-T*2.)),.7);'+'float w1=(fb(vec2(ax*7.-T,sp.y*7.))-.5)*.025;'+'float top1=.43+l1+w1;'+'float m1=smoothstep(top1+.012,top1-.012,sp.y);'+'float sh1=smoothstep(top1-.22,top1-.005,sp.y);'+'vec3 s1=mix(vec3(.86,.88,.95),vec3(1.,.99,.975),sh1);'+'s1*=.97+.06*fb(vec2(ax*9.-T,sp.y*9.));'+'col=mix(col,s1+sun*.06,m1);'+'float l2=.07*pow(abs(sin(ax*2.1+T*1.1+.7)),.55)+.05*pow(abs(sin(ax*5.3+T*1.6+2.4)),.6)+.03*pow(abs(sin(ax*11.+T*2.4)),.7);'+'float w2=(fb(vec2(ax*6.+T,sp.y*6.+4.))-.5)*.03;'+'float top2=.24+l2+w2;'+'float m2=smoothstep(top2+.012,top2-.012,sp.y);'+'float sh2=smoothstep(top2-.24,top2-.005,sp.y);'+'vec3 s2=mix(vec3(.96,.93,.93),vec3(1.,1.,.985),sh2);'+'s2*=.975+.05*fb(vec2(ax*8.+T,sp.y*8.+2.));'+'col=mix(col,s2,m2);'+'col+=vec3(1.,.95,.85)*(smoothstep(.06,0.,abs(sp.y-top1))*.05+smoothstep(.06,0.,abs(sp.y-top2))*.05);'+
      'gl_FragColor=vec4(col,1.);}';
    var gl,ur,ut,um,live=false,raf=0,frame=0;
    var mx=-1e4,my=-1e4,smx=-1e4,smy=-1e4,t0=performance.now();
    function init(){
      gl=c.getContext('webgl',{premultipliedAlpha:false,antialias:false,powerPreference:'low-power'});
      if(!gl) return false;
      function sh(type,src){var o=gl.createShader(type);gl.shaderSource(o,src);gl.compileShader(o);return o;}
      var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
      if(!gl.getProgramParameter(pr,gl.LINK_STATUS)) return false;
      gl.useProgram(pr);
      var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);

      ur=gl.getUniformLocation(pr,'r');ut=gl.getUniformLocation(pr,'t');um=gl.getUniformLocation(pr,'m');
      size(); return true;
    }
    function size(){ c.width=Math.max(1,Math.round(innerWidth*sc)); c.height=Math.max(1,Math.round(innerHeight*sc)); if(gl) gl.viewport(0,0,c.width,c.height); }
    function fr(now){
      raf=0; if(!live) return;
      frame++;

        gl.drawArrays(gl.TRIANGLES,0,3);
      }
      if(!reduce) raf=requestAnimationFrame(fr);
    }
    function start(){ live=init(); if(live&&!raf) raf=requestAnimationFrame(fr); }
    c.addEventListener('webglcontextlost',function(e){ e.preventDefault(); live=false; if(raf){cancelAnimationFrame(raf);raf=0;} });
    c.addEventListener('webglcontextrestored',start);
    addEventListener('resize',size);
    addEventListener('pointermove',function(e){ mx=e.clientX*sc; my=(innerHeight-e.clientY)*sc; if(smx<-1e3){smx=mx;smy=my;} },{passive:true});
    start();
  })();

  /* дым: тянется за курсором/пальцем, в покое сам медленно поднимается */
  var cv=document.getElementById('fx'), g=cv.getContext('2d'), W,H,P=[];

    if(P.length>(matchMedia('(pointer:coarse)').matches?160:420)) P.shift();

      a:0,max:big?.12:.22,life:0,dur:220+Math.random()*180,rot:Math.random()*6.28,vr:(Math.random()-.5)*.01});
  }

    var x=e.clientX,y=e.clientY;
    if(px!==null){ var dx=x-px, dy=y-py, n=Math.min(6,1+Math.hypot(dx,dy)/14);

  addEventListener('pointerdown',function(e){ for(var i=0;i<14;i++) puff(e.clientX,e.clientY,(Math.random()-.5)*3,(Math.random()-.5)*3,false); });
  var tick=0;
  (function draw(){
    tick++;
    g.clearRect(0,0,W,H);
    for(var i=P.length-1;i>=0;i--){ var p=P[i];
      p.life++; p.x+=p.vx; p.y+=p.vy; p.vx*=.985; p.vy=p.vy*.985-.006; p.s+=p.gr; p.rot+=p.vr;
      var k=p.life/p.dur; if(k>=1){ P.splice(i,1); continue; }
      var al=p.max*(k<.15?k/.15:1-(k-.15)/.85);
      g.globalAlpha=al; g.save(); g.translate(p.x,p.y); g.rotate(p.rot); g.drawImage(spr,-p.s,-p.s,p.s*2,p.s*2); g.restore();
    }
    g.globalAlpha=1;
    if(!reduce) requestAnimationFrame(draw);
  })();
})();
